<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Photo Booth-style app icon, drawn for samdickie.me (not Apple's artwork):
       a red rounded square, two photos and a camera lens -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4b3e"/>
      <stop offset="1" stop-color="#e0111b"/>
    </linearGradient>
    <radialGradient id="body" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#5a5a5e"/>
      <stop offset=".6" stop-color="#2a2a2d"/>
      <stop offset="1" stop-color="#111113"/>
    </radialGradient>
    <radialGradient id="glass" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#9ad7ff"/>
      <stop offset=".35" stop-color="#6a4bd8"/>
      <stop offset=".7" stop-color="#1f6f5a"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </radialGradient>
    <clipPath id="photo"><rect x="36" y="23" width="42" height="44"/></clipPath>
  </defs>

  <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>

  <!-- Photo at the back: a white frame, tilted -->
  <rect x="17" y="29" width="36" height="44" fill="none" stroke="#fff" stroke-width="3.5" transform="rotate(-14 35 51)"/>

  <!-- Photo at the front: a person -->
  <rect x="34" y="21" width="46" height="48" fill="#fff"/>
  <g clip-path="url(#photo)" fill="#e0111b">
    <circle cx="57" cy="39" r="8.5"/>
    <path d="M40 70a17 15 0 0 1 34 0z"/>
  </g>

  <!-- Camera lens -->
  <circle cx="73" cy="73" r="20" fill="#000" opacity=".25" transform="translate(1 2)"/>
  <circle cx="73" cy="73" r="20" fill="url(#body)"/>
  <circle cx="73" cy="73" r="13.5" fill="#141416" stroke="#48484c" stroke-width="1.5"/>
  <circle cx="73" cy="73" r="8.5" fill="url(#glass)"/>
  <ellipse cx="69.5" cy="69.5" rx="3" ry="2" fill="#fff" opacity=".55" transform="rotate(-45 69.5 69.5)"/>
</svg>
